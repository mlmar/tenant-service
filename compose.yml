name: tenant-service
services:
  backend:
    build:
      context: .
      target: development
    working_dir: /app/backend
    command: npm run dev
    env_file:
      - path: backend/.env.local
        required: false
    environment:
      PORT: 3000
      NODE_ENV: development
    ports:
      - "${API_PORT:-3000}:3000"
    develop:
      watch:
        - action: rebuild
          path: ./brand.json
        - action: sync+restart
          path: ./backend/src
          target: /app/backend/src
          initial_sync: true
        - action: sync+restart
          path: ./backend/certs
          target: /app/backend/certs
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: .
      target: development
    working_dir: /app/frontend
    command: npm run dev
    env_file:
      - path: frontend/.env.local
        required: false
    environment:
      EXPO_PUBLIC_API_URL: ${DEV_API_URL:-http://localhost:3000/api}
      PORT: 8081
      NODE_ENV: development
      EXPO_DEV_SERVER_WITHOUT_TUNNEL: "true"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_WEBPACK_DEV_SERVER_HOST: 0.0.0.0
      WDS_SOCKET_PORT: 8081
      EXPO_NO_DEPENDENCY_VALIDATION: "true"
    ports:
      - "${WEB_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./brand.json
        - action: sync
          path: ./frontend/src
          target: /app/frontend/src
          initial_sync: true
        - action: sync
          path: ./frontend/assets
          target: /app/frontend/assets
          initial_sync: true
        - action: sync
          path: ./frontend/public
          target: /app/frontend/public
        - action: sync
          path: ./frontend/App.tsx
          target: /app/frontend/App.tsx
          initial_sync: true
        - action: sync
          path: ./frontend/index.ts
          target: /app/frontend/index.ts
        - action: sync+restart
          path: ./frontend/app.json
          target: /app/frontend/app.json
        - action: sync+restart
          path: ./frontend/app.config.js
          target: /app/frontend/app.config.js
        - action: sync+restart
          path: ./frontend/metro.config.js
          target: /app/frontend/metro.config.js
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
  app:
    profiles: [combined]
    build:
      context: .
      target: runtime
      args:
        EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    env_file:
      - path: backend/.env.local
        required: false
    environment:
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
